name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: pnpm run build:web
      - run: pnpm exec electron-builder --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishLearner-Windows-x64
          path: release/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: pnpm run build:web
      - run: CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac dmg --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishLearner-macOS-arm64
          path: release/*.dmg
          if-no-files-found: error
